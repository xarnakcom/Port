<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио</title>
<style>
  :root{
    --bg: #0c0d0b;
    --bg-raised: #15160f;
    --ink: #ece7db;
    --ink-dim: #9b9686;
    --line: #2a2b23;
    --accent: #b8863b;
    --moss: #6b7156;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--ink); font-family:'Inter', -apple-system, system-ui, sans-serif;}

  @font-face {
    font-family:'Fraunces-fallback';
    src:local('Georgia');
  }

  header{
    padding: 8vh 6vw 4vh;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow{
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--moss);
    margin-bottom: 1.2rem;
    font-weight: 600;
  }
  h1{
    font-family: 'Fraunces-fallback', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2rem, 5vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    max-width: 16ch;
  }
  .sub{
    margin-top: 1.4rem;
    color: var(--ink-dim);
    font-size: 1rem;
    max-width: 46ch;
    line-height: 1.5;
  }

  main{ padding: 5vh 6vw 10vh; }

  #status{
    color: var(--ink-dim);
    font-size: 0.9rem;
    padding: 3vh 0;
  }
  #status.error{ color: #c96b4e; }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .card{
    position: relative;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 4/5;
  }
  .card img, .card video{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }
  .card:hover img, .card:hover video{
    transform: scale(1.04);
  }
  .card .tag{
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(12,13,11,0.72);
    color: var(--ink);
    padding: 4px 8px;
    border-radius: 2px;
    backdrop-filter: blur(2px);
  }
  .card .name{
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 10px 12px;
    font-size: 0.78rem;
    color: var(--ink);
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card:hover .name{ opacity: 1; }
  .card .playbadge{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .card .playbadge svg{
    width: 46px; height: 46px;
    opacity: 0.85;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }

  /* Lightbox */
  #lightbox{
    position: fixed; inset: 0;
    background: rgba(6,6,5,0.94);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 4vh 4vw;
  }
  #lightbox.open{ display: flex; }
  #lightbox img, #lightbox video{
    max-width: 100%;
    max-height: 86vh;
    border-radius: 2px;
  }
  #lightbox .close{
    position: absolute;
    top: 24px; right: 32px;
    color: var(--ink);
    font-size: 1.8rem;
    cursor: pointer;
    line-height: 1;
    opacity: 0.7;
  }
  #lightbox .close:hover{ opacity: 1; }
  #lightbox .fallback{
    color: var(--ink-dim);
    text-align: center;
    font-size: 0.95rem;
  }
  #lightbox .fallback a{
    color: var(--accent);
    text-decoration: underline;
  }

  footer{
    padding: 4vh 6vw 6vh;
    color: var(--ink-dim);
    font-size: 0.8rem;
    border-top: 1px solid var(--line);
  }

  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce){
    .card img, .card video, .card .name{ transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Портфолио &mdash; работы</div>
  <h1>Фото и видео с рабочего диска.</h1>
  <p class="sub">Галерея подключена напрямую к папке на Яндекс.Диске — новые файлы, добавленные в папку, появляются здесь при обновлении страницы.</p>
</header>

<main>
  <div id="status">Загрузка списка файлов…</div>
  <div class="grid" id="grid"></div>
</main>

<footer>Обновляется автоматически из облачной папки.</footer>

<div id="lightbox">
  <span class="close" id="lightboxClose">&times;</span>
  <div id="lightboxContent"></div>
</div>

<script>
/* =========================================================
   НАСТРОЙКА
   Вставь сюда публичную ссылку на папку с Яндекс.Диска
   (Диск -> папка -> "Поделиться" -> "Скопировать ссылку")
   ========================================================= */
const YANDEX_PUBLIC_FOLDER_URL = "https://disk.yandex.ru/d/-nJYU0By1Z8NRA";

/* Сколько файлов запрашивать за раз (макс. допустимый Яндексом на страницу) */
const PAGE_SIZE = 100;

const API_BASE = "https://cloud-api.yandex.net/v1/disk/public/resources";

const statusEl = document.getElementById('status');
const gridEl = document.getElementById('grid');
const lightbox = document.getElementById('lightbox');
const lightboxContent = document.getElementById('lightboxContent');
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxContent.innerHTML = '';
}

function isImage(mime){ return mime && mime.startsWith('image/'); }
function isVideo(mime){ return mime && mime.startsWith('video/'); }

function playIcon(){
  return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="12" cy="12" r="11" fill="rgba(12,13,11,0.55)" stroke="#ece7db" stroke-width="1.2"/>' +
    '<path d="M10 8.5L16 12L10 15.5V8.5Z" fill="#ece7db"/></svg>';
}

function buildCard(item){
  const card = document.createElement('div');
  card.className = 'card';

  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = isVideo(item.mime_type) ? 'видео' : 'фото';
  card.appendChild(tag);

  if (isImage(item.mime_type)) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = item.name;
    img.src = item.preview ? item.preview + '&size=M' : item.file;
    img.onerror = () => { img.src = item.file; };
    card.appendChild(img);
  } else if (isVideo(item.mime_type)) {
    const video = document.createElement('video');
    video.src = item.file;
    video.muted = true;
    video.preload = 'metadata';
    video.playsInline = true;
    card.appendChild(video);

    const badge = document.createElement('div');
    badge.className = 'playbadge';
    badge.innerHTML = playIcon();
    card.appendChild(badge);
  } else {
    return null; // skip non-media files
  }

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = item.name;
  card.appendChild(name);

  card.addEventListener('click', () => openLightbox(item));
  return card;
}

function openLightbox(item){
  lightboxContent.innerHTML = '';
  if (isImage(item.mime_type)) {
    const img = document.createElement('img');
    img.src = item.file;
    img.alt = item.name;
    lightboxContent.appendChild(img);
  } else if (isVideo(item.mime_type)) {
    const video = document.createElement('video');
    video.src = item.file;
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.onerror = () => {
      lightboxContent.innerHTML =
        '<div class="fallback">Браузер не смог воспроизвести это видео напрямую.<br>' +
        '<a href="' + item.file + '" target="_blank" rel="noopener">Открыть / скачать файл</a></div>';
    };
    lightboxContent.appendChild(video);
  }
  lightbox.classList.add('open');
}

async function fetchAllItems(publicKey){
  let items = [];
  let offset = 0;
  while (true) {
    const url = `${API_BASE}?public_key=${encodeURIComponent(publicKey)}&limit=${PAGE_SIZE}&offset=${offset}&preview_size=M`;
    const res = await fetch(url);
    if (!res.ok) {
      const body = await res.text();
      throw new Error(`Яндекс API вернул ошибку ${res.status}: ${body}`);
    }
    const data = await res.json();
    const embedded = data._embedded;
    if (!embedded || !embedded.items) break;
    items = items.concat(embedded.items);
    if (embedded.items.length < PAGE_SIZE) break;
    offset += PAGE_SIZE;
  }
  return items;
}

async function init(){
  if (!YANDEX_PUBLIC_FOLDER_URL || YANDEX_PUBLIC_FOLDER_URL.includes('ВСТАВЬ_СЮДА')) {
    statusEl.textContent = 'Не задана ссылка на папку. Открой index.html и вставь свою публичную ссылку на Яндекс.Диск в переменную YANDEX_PUBLIC_FOLDER_URL.';
    statusEl.classList.add('error');
    return;
  }

  try {
    const items = await fetchAllItems(YANDEX_PUBLIC_FOLDER_URL);
    const mediaItems = items.filter(i => i.type === 'file' && (isImage(i.mime_type) || isVideo(i.mime_type)));

    if (mediaItems.length === 0) {
      statusEl.textContent = 'В папке пока нет изображений или видео.';
      return;
    }

    mediaItems.sort((a, b) => new Date(b.created) - new Date(a.created));

    mediaItems.forEach(item => {
      const card = buildCard(item);
      if (card) gridEl.appendChild(card);
    });

    statusEl.textContent = '';
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Не удалось загрузить файлы с Яндекс.Диска: ' + err.message;
    statusEl.classList.add('error');
  }
}

init();
</script>

</body>
</html>
