<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xarnak — Портфолио</title>

<!-- ШРИФТЫ (те же, что на xarnak.com и go.xarnak.com) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/xarnakcom/nauryz-red-keds/fonts.css" rel="stylesheet">

<style>
  :root{
    --bg: #FFFDF8;
    --bg-raised: #F3EFE4;
    --ink: #17181A;
    --ink-dim: #6b6b6b;
    --line: #e7e2d4;
    --accent: #F2CC00;
    --text-dark: #17181A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--ink); font-family:'Inter', -apple-system, system-ui, sans-serif;}
  a{ color: inherit; }
  img{ display:block; max-width:100%; }

  .display{
    font-family: 'NauryzRedKeds', Georgia, serif;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  /* NAVBAR */
  header{ border-bottom: 1px solid var(--line); }
  .navbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px 6vw;
    max-width: 1400px;
    margin: 0 auto;
  }
  .navbar .brand img{ height: 10%; }
  .navbar nav{ display: flex; gap: 28px; }
  .navbar nav a{ text-decoration:none; font-size: 0.9rem; font-weight: 500; }
  .navbar nav a:hover{ opacity: 0.65; }
  .btn-pill{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 12px 22px;
    border-radius: 999px;
    white-space: nowrap;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn-pill:hover{ transform: translateY(-1px); opacity: 0.92; }
  .btn-dark{ background: var(--ink); color: #fff; }
  .btn-outline{ background: transparent; color: var(--ink); border: 1px solid var(--line); }

  /* HERO */
  .hero{ padding: 6vh 6vw 4vh; max-width: 1200px; margin: 0 auto; }
  .hero-greet{
    text-align: center;
    font-size: clamp(1.8rem, 4.2vw, 3rem);
    line-height: 1.15;
    margin-bottom: 3vh;
  }
  .hero-greet .script{
    font-style: italic;
    font-weight: 400;
    color: var(--ink-dim);
  }

  .hero-photo-frame{
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 20%, rgba(242,204,0,0.45), rgba(255,253,248,0) 65%),
      var(--bg-raised);
    aspect-ratio: 16/10;
    max-height: 70vh;
  }
  .hero-photo-frame img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  .hero-meta-row{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 24px;
  }
  .hero-chip{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .hero-chip .dot{
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(242,204,0,0.25);
  }
  .hero-specialty{
    max-width: 34ch;
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--ink-dim);
    text-align: right;
  }

  .hero-name-row{
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-top: 6vh;
  }
  .hero-name{
    font-size: clamp(2.6rem, 8vw, 5.2rem);
    line-height: 0.98;
  }
  .hero-role{
    font-size: clamp(1.4rem, 3.2vw, 2rem);
    line-height: 1.05;
    text-align: right;
  }

  /* PROJECTS */
  .projects-section{ padding: 8vh 6vw 10vh; max-width: 1300px; margin: 0 auto; }
  .section-title{
    font-size: clamp(1.8rem, 3.6vw, 2.6rem);
    margin-bottom: 4vh;
  }
  #projectsStatus{ color: var(--ink-dim); font-size: 0.9rem; }
  #projectsStatus.error{ color: #b3462c; }

  .projects-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }
  .project-card{
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .project-cover{
    border-radius: 20px;
    overflow: hidden;
    aspect-ratio: 4/3;
    background: var(--bg-raised);
  }
  .project-cover img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }
  .project-card:hover .project-cover img{ transform: scale(1.04); }
  .project-info{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .project-title{
    font-weight: 600;
    font-size: 1.05rem;
  }
  .project-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .project-link:hover{ background: var(--ink); color: #fff; border-color: var(--ink); }

  .all-works-wrap{
    display: flex;
    justify-content: center;
    margin-top: 6vh;
  }

  footer{
    padding: 4vh 6vw 6vh;
    color: var(--ink-dim);
    font-size: 0.8rem;
    border-top: 1px solid var(--line);
    text-align: center;
  }

  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 640px){
    .hero-meta-row, .hero-name-row{ flex-direction: column; align-items: flex-start; }
    .hero-specialty, .hero-role{ text-align: left; }
  }
</style>
</head>
<body>

<header>
  <div class="navbar">
    <a href="index.html" class="brand">
      <img src="https://cdn.jsdelivr.net/gh/xarnakcom/go.xarnak.com/logos/xarnak.com.svg" alt="Xarnak">
    </a>
    <nav>
      <a href="https://go.xarnak.com">Контакты</a>
      <a href="works.html">Все работы</a>
    </nav>
    <a href="https://t.me/xarnakcom" class="btn-pill btn-dark" target="_blank" rel="noopener">Написать ↗</a>
  </div>
</header>

<section class="hero">

  <div class="hero-meta-row">
    <div class="hero-chip"><span class="dot"></span> Открыт для новых проектов</div>
    <div class="hero-specialty">Веб-разработка, умный дом, AI-видео и фото, туры на природе.</div>
  </div>

  <div class="hero-name-row">
    <div class="hero-name display">Я — САМАТ<br>ИСЕНОВ</div>
    <div class="hero-role display">ИНЖЕНЕР-<br>ДИЗАЙНЕР</div>
  </div>
</section>

<section class="projects-section" id="projects">
  <h2 class="section-title display">Последние работы</h2>
  <div id="projectsStatus">Загрузка проектов…</div>
  <div class="projects-grid" id="projectsGrid"></div>
  <div class="all-works-wrap">
    <a href="works.html" class="btn-pill btn-outline">Показать все работы →</a>
  </div>
</section>

<footer>Обновляется автоматически из облачной папки на Яндекс.Диске.</footer>

<script>
const PROJECTS_JSON_PATH = "./projects.json";
const statusEl = document.getElementById('projectsStatus');
const gridEl = document.getElementById('projectsGrid');

function encodeMediaPath(p){
  return p.split('/').map(encodeURIComponent).join('/');
}

function buildProjectCard(project){
  const card = document.createElement('div');
  card.className = 'project-card';

  const cover = document.createElement('div');
  cover.className = 'project-cover';
  if (project.cover) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = project.name;
    img.src = encodeMediaPath(project.cover);
    cover.appendChild(img);
  }
  card.appendChild(cover);

  const info = document.createElement('div');
  info.className = 'project-info';

  const title = document.createElement('div');
  title.className = 'project-title';
  title.textContent = project.name;
  info.appendChild(title);

  const link = document.createElement('a');
  link.className = 'project-link';
  link.href = `works.html?project=${encodeURIComponent(project.name)}`;
  link.textContent = 'Смотреть →';
  info.appendChild(link);

  card.appendChild(info);
  return card;
}

async function init(){
  try {
    const res = await fetch(PROJECTS_JSON_PATH, { cache: 'no-store' });
    if (!res.ok) {
      throw new Error(`не удалось загрузить projects.json (${res.status}). Возможно, GitHub Action ещё не запускался — запусти его вручную на вкладке Actions.`);
    }
    const projects = await res.json();

    if (!projects || projects.length === 0) {
      statusEl.textContent = 'Проектов пока нет — добавь папку с файлами на Яндекс.Диске.';
      return;
    }

    projects.forEach(p => gridEl.appendChild(buildProjectCard(p)));
    statusEl.textContent = '';
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Не удалось загрузить список проектов: ' + err.message;
    statusEl.classList.add('error');
  }
}

init();
</script>

</body>
</html>
