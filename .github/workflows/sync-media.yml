name: Sync media from Yandex.Disk

on:
  schedule:
    - cron: "0 * * * *"   # каждый час; поменяй при желании
  workflow_dispatch: {}    # + кнопка "Run workflow" для ручного запуска

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch media list from Yandex.Disk
        env:
          YANDEX_PUBLIC_FOLDER_URL: ${{ vars.YANDEX_PUBLIC_FOLDER_URL }}
        run: node scripts/sync-media.mjs

      - name: Commit new/removed media files if changed
        run: |
          git config user.name "media-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media.json projects.json media/
          git diff --cached --quiet || git commit -m "Синхронизация медиафайлов с Яндекс.Диска"
          git push
